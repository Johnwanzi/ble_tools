plugins { id 'com.android.application' }

android {
    namespace 'com.bletools.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.bletools.app'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
        testInstrumentationRunner 'com.bletools.app.SmokeInstrumentation'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError true }
}

// The protocol suite is plain Java so it also runs without an Android device.
tasks.register('protocolTest', JavaExec) {
    dependsOn 'compileDebugUnitTestJavaWithJavac'
    classpath = files(layout.buildDirectory.dir('intermediates/javac/debug/compileDebugJavaWithJavac/classes'),
            layout.buildDirectory.dir('intermediates/javac/debugUnitTest/compileDebugUnitTestJavaWithJavac/classes'))
    mainClass = 'com.bletools.app.ProtocolTest'
    args file('src/test/resources/desktop-vectors.tsv').absolutePath
}
